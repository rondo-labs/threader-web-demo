[project]
name = "threader-demo-pipeline"
version = "0.1.0"
description = "Builds the demo site's data from the opta-scraper lake (Opta-native, see docs/adr/0001)."
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=17",
    "pypinyin>=0.55.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E731", "E501"]  # small named lambdas read well in the section builders; the formatter owns line length
