# Step 2 on the server: /etc/nginx/sites-enabled/threader.matchmate.chat.conf (nginx 1.24, Ubuntu 24.04).
# The certificate comes from certbot (webroot, renewed by its timer); maps and locations are read from the repo clone,
# so a git pull plus `sudo nginx -s reload` updates them. invites.map stays outside the repo: it holds the tokens.
include /home/xingnanzhu/threader-web-demo/deploy/nginx/threader-maps.conf;

server {
    listen 80;
    listen [::]:80;
    server_name threader.matchmate.chat;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name threader.matchmate.chat;
    ssl_certificate     /etc/letsencrypt/live/threader.matchmate.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/threader.matchmate.chat/privkey.pem;

    set $threader_cookie_flags "; Secure";
    include /home/xingnanzhu/threader-web-demo/deploy/nginx/threader-site.inc;
}
