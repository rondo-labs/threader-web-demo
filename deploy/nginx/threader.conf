# On the server: /etc/nginx/conf.d/threader.matchmate.chat.conf (nginx 1.24, Ubuntu 24.04), replacing the placeholder
# set up with the domain. The certificate is the server's *.matchmate.chat wildcard, renewed by acme.sh (DNS-01)
# alongside the other matchmate.chat sites. Maps and locations are read from the repo clone, so a git pull plus
# `sudo nginx -s reload` updates them. invites.map stays outside the repo: it holds the tokens.
include /home/xingnanzhu/threader-web-demo/deploy/nginx/threader-maps.conf;

server {
    listen 80;
    listen [::]:80;
    server_name threader.matchmate.chat;
    return 301 https://threader.matchmate.chat$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name threader.matchmate.chat;
    ssl_certificate     /etc/nginx/certs/matchmate.chat/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/matchmate.chat/key.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    set $threader_cookie_flags "; Secure";
    include /home/xingnanzhu/threader-web-demo/deploy/nginx/threader-site.inc;
}
