# http context. Which club an invite token belongs to, read from the link (?k=) and from the cookie.
# invites.map holds one line per club: "<token>" "<club>"; (deploy/invite.sh adds them). An unknown token maps to "".
map $arg_k $invite_from_link {
    default "";
    include /etc/nginx/threader/invites.map;
}
map $cookie_threader_invite $invite_club {
    default "";
    include /etc/nginx/threader/invites.map;
}
log_format threader escape=none '$remote_addr [$time_local] "$request" $status $body_bytes_sent club="$invite_club"';
