# Step 1 on the server, before a certificate exists: answer Let's Encrypt on port 80, nothing else.
# Install as /etc/nginx/sites-enabled/threader.matchmate.chat.conf, reload, run certbot, then replace with threader.conf.
server {
    listen 80;
    listen [::]:80;
    server_name threader.matchmate.chat;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 404;
    }
}
