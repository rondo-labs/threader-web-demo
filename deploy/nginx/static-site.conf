# Local stand-in for the server's /etc/nginx/conf.d/threader.matchmate.chat.conf (set up by the server admin):
# a plain static site over one folder. Same root rules; plain HTTP on 8080 instead of the wildcard certificate.
server {
    listen 8080;
    server_name _;

    root /var/www/threader.matchmate.chat/public;
    index index.html;
    disable_symlinks on from=$document_root;

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
