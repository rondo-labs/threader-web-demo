# The same gate on this Mac, in Docker (deploy/local-test.sh): plain http on port 8080.
# The container mounts the repo and the videos at the server's paths, so threader-site.inc is used unchanged.
include /home/xingnanzhu/threader-web-demo/deploy/nginx/threader-maps.conf;

server {
    listen 8080;
    server_name localhost;
    set $threader_cookie_flags "";
    include /home/xingnanzhu/threader-web-demo/deploy/nginx/threader-site.inc;
}
